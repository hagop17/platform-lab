apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # emptyDir, NOT a PersistentVolumeClaim. A PVC would make
        # Kubernetes provision an EBS volume that Terraform never sees and
        # `destroy` never deletes — breaking the invariant that everything
        # billable lives in Terraform's state. The data is a few minutes of
        # demo metrics; losing it is the point.
        - name: data
          emptyDir: {}

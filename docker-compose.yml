services:
  app:
    build:
      context: .
      # Set to "true" (or pass --build-arg WITH_ANTHROPIC=true) and rebuild
      # when using LLM_PROVIDER=anthropic — the anthropic SDK is an opt-in
      # extra, not installed by default.
      args:
        WITH_ANTHROPIC: ${WITH_ANTHROPIC:-false}
    ports:
      - "8000:8000"   # FastAPI app
      - "9464:9464"   # OTel Prometheus metrics endpoint
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - TPR_RAG_DATA_DIR=/home/appuser/.tpr-rag/chroma_data
    volumes:
      # Shares the host's already-ingested ChromaDB index (run rag/ingest.py
      # on the host, not inside the container, to avoid root-owned files —
      # see docs/tpr_rag_spec.md). The container only reads it; the app process
      # still needs a restart after any re-ingestion (same rule as running
      # outside Docker). The container runs as appuser (uid 1000, see
      # Dockerfile), not root.
      - ${HOME}/.tpr-rag/chroma_data:/home/appuser/.tpr-rag/chroma_data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:Z
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      # Local demo only — this stack binds to localhost and ships no real data.
      # Do not reuse this compose file as-is for anything internet-facing.
      - GF_SECURITY_ADMIN_PASSWORD=admin

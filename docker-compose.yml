services:
  app:
    build:
      context: .
      # Set to "true" (or pass --build-arg WITH_ANTHROPIC=true) and rebuild
      # when using LLM_PROVIDER=anthropic — the anthropic SDK is an opt-in
      # extra, not installed by default.
      args:
        WITH_ANTHROPIC: ${WITH_ANTHROPIC:-false}
    ports:
      - "8000:8000"   # FastAPI app
      - "9464:9464"   # OTel Prometheus metrics endpoint
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      # Bare passthrough (no `=`): if unset in .env these aren't defined in the
      # container at all, so llm_providers.py's own defaults apply. Writing
      # `${GROQ_MODEL:-}` instead would set them to "" and defeat that.
      - GROQ_MODEL
      - ANTHROPIC_MODEL
      - TPR_RAG_DATA_DIR=/home/appuser/.tpr-rag/chroma_data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:Z
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      # Local demo only — this stack binds to localhost and ships no real data.
      # Do not reuse this compose file as-is for anything internet-facing.
      - GF_SECURITY_ADMIN_PASSWORD=admin

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Limits GITHUB_TOKEN to read-only. Only actions/checkout uses the token, and it
# just needs to clone — no step here writes anything back to GitHub.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not a mutable tag — see GitHub's "Security
      # hardening for GitHub Actions" guide. Dependabot (dependabot.yml)
      # opens a PR to bump these when a new release ships.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # rag/tpr_rag.py loads the embedding model at import time; the RAG tests
      # self-skip if it isn't cached (see tests/test_tpr_rag.py). Warm the HF
      # cache here so those tests actually run in CI instead of silently skipping.
      - name: Warm embedding-model cache
        run: uv run python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Terraform format check
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - run: terraform fmt -check -recursive terraform

      # -backend=false skips S3, so this needs no AWS credentials —
      # consistent with the repo convention that CI never reaches the
      # network for state.
      - name: Terraform validate
        run: |
          terraform -chdir=terraform/eks init -backend=false
          terraform -chdir=terraform/eks validate

      # Pinned to an exact release + checksum, not /latest/, so CI doesn't
      # silently pick up a new kubeconform version between runs.
      - name: Install kubeconform
        run: |
          curl -sSLf -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # No cluster exists in CI, so this is schema-only validation against
      # kubeconform's bundled JSON schemas. -strict rejects unknown
      # fields (catches typos like a misspelled probe field), but it
      # still can't catch a Deployment/Service selector-label mismatch —
      # that's semantically wrong, not schema-invalid.
      - name: Validate k8s manifests
        run: kubeconform -strict -summary k8s/*.yaml

      - name: Typecheck
        run: uv run pyright

      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit

      # HF_HUB_OFFLINE mirrors the pre-commit hook: the model is already cached
      # above, so the suite runs fully without any test making a network call.
      - name: Test
        run: uv run pytest
        env:
          HF_HUB_OFFLINE: "1"

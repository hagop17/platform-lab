version: 2
updates:
  # Keeps the SHA-pinned actions in ci.yml current — opens a PR bumping the
  # SHA (and version comment) when actions/checkout or astral-sh/setup-uv
  # ship a new release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Keeps the digest-pinned Prometheus image in k8s/prometheus-deployment.yaml
  # current — same reason the actions above are SHA-pinned: the pin is what
  # makes a restart reproducible, and this is what stops the pin going stale.
  # Dependabot picks up any YAML here that parses with both `apiVersion` and
  # `kind`, and bumps the tag and its sha256 digest together.
  - package-ecosystem: "docker"
    directory: "/k8s"
    schedule:
      interval: "monthly"

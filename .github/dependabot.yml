version: 2
updates:
  # Keeps the SHA-pinned actions in ci.yml current — opens a PR bumping the
  # SHA (and version comment) when actions/checkout or astral-sh/setup-uv
  # ship a new release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Python deps. Must be "uv", not "pip": the pip ecosystem reads
  # pyproject.toml but won't regenerate uv.lock, leaving the two out of sync.
  # Alerts come from the dependency graph parsing uv.lock with no config at
  # all, but version-update PRs only fire for ecosystems declared here.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"

[project]
name = "platform-lab"
version = "0.1.0"
description = "FastAPI service with OpenTelemetry, Prometheus/Grafana, and LLM-assisted metrics + RAG analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "chromadb>=0.5.0",
    "fastapi[standard]>=0.137.1",
    "groq>=0.32.0",
    "httpx>=0.28.1",
    "mcp<2",
    "mcp-use>=1.7.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-prometheus>=0.64b0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-sdk>=1.43.0",
    "prometheus-client>=0.25.0",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.0.0",
    # Listed explicitly (not just pulled in transitively by sentence-transformers)
    # so that [tool.uv.sources] below can override its index — uv only applies
    # source overrides to direct project dependencies.
    "torch>=1.11.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.116.0"]

# This container never does GPU inference (see Dockerfile) — pin torch to
# the CPU-only wheel index so `uv sync` doesn't pull the CUDA-bundled build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# No CPU-specific wheel exists for macOS (default PyPI torch is already
# CPU-only there); only override on Linux, which is what the Dockerfile builds for.
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; S101 (assert stripped under `python -O`) doesn't
# apply to test code.
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
# tests/ has no __init__.py, so pytest's default import mode won't put the
# project root on sys.path on its own — needed for `import metrics_analysis`
# / `import rag...` to resolve.
pythonpath = ["."]
